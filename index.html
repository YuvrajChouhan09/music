
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Lyrics Display</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        .song-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1DB954; /* Spotify Green */
            margin-bottom: 4px;
        }
        .artist-name {
            font-size: 1.1rem;
            color: #b3b3b3;
            margin-bottom: 20px;
        }
        .lyrics-box {
            max-height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 1rem;
            line-height: 1.6;
            color: #e0e0e0;
            background: #121212;
            padding: 16px;
            border-radius: 8px;
            text-align: left;
        }
        .status {
            font-size: 0.85rem;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="song-title" class="song-title">Waiting for music...</div>
    <div id="artist-name" class="artist-name">Play a track on Spotify</div>
    <div id="lyrics" class="lyrics-box">Lyrics will appear here when a song starts...</div>
    <div id="status" class="status">Status: Idle</div>
</div>
<script>
    // -------------------------------------------------------------
    // REPLACE THESE TWO VALUES WITH YOUR ACTUAL LAST.FM DETAILS
    // -------------------------------------------------------------
    const LASTFM_USERNAME = "YOUR_LASTFM_USERNAME";
    const LASTFM_API_KEY  = "YOUR_LASTFM_API_KEY";
    // -------------------------------------------------------------

    let currentTrackSignature = "";

    async function checkCurrentSong() {
        if (LASTFM_USERNAME === "YOUR_LASTFM_USERNAME") {
            document.getElementById("status").innerText = "Error: Please update script with your Last.fm API Key & Username!";
            return;
        }

        try {
            const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=1`;
            const res = await fetch(url);
            const data = await res.json();

            const track = data.recenttracks?.track?.[0];
            const isPlaying = track?.["@attr"]?.nowplaying === "true";

            if (track && isPlaying) {
                const songTitle = track.name;
                const artistName = track.artist["#text"];
                const signature = `${songTitle} - ${artistName}`;

                // Only fetch lyrics if the song actually changed
                if (signature !== currentTrackSignature) {
                    currentTrackSignature = signature;
                    document.getElementById("song-title").innerText = songTitle;
                    document.getElementById("artist-name").innerText = artistName;
                    fetchLyrics(artistName, songTitle);
                }
            } else {
                document.getElementById("song-title").innerText = "Nothing Playing";
                document.getElementById("artist-name").innerText = "Start music on Spotify";
                document.getElementById("lyrics").innerText = "No active song detected.";
                document.getElementById("status").innerText = "Idle";
                currentTrackSignature = "";
            }
        } catch (err) {
            console.error(err);
            document.getElementById("status").innerText = "Error checking Spotify status.";
        }
    }

    // Helper function to remove timestamps like [00:12.34] from synced lyrics
    function cleanSyncedLyrics(syncedLyrics) {
        if (!syncedLyrics) return "";
        return syncedLyrics.replace(/\[\d{2}:\d{2}\.\d{2,3}\]\s?/g, "");
    }

    async function fetchLyrics(artist, track) {
        document.getElementById("lyrics").innerText = "Fetching lyrics...";
        document.getElementById("status").innerText = "Searching lyrics database...";

        // 1. Clean up title and artist (Remove "(Remastered)", "feat.", extra hyphens, etc.)
        const cleanTrack = track.replace(/[\(\[\-].*?(remaster|feat|ft|deluxe|version|edition|live).*?[\)\]\-]/gi, "").trim();
        const cleanArtist = artist.split(/[,&]/)[0].trim(); // Get primary artist only

        try {
            // 2. Try exact match first
            let res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(cleanArtist)}&track_name=${encodeURIComponent(cleanTrack)}`);
            
            if (res.ok) {
                const data = await res.json();
                const lyricsText = data.plainLyrics || cleanSyncedLyrics(data.syncedLyrics);
                if (lyricsText) {
                    document.getElementById("lyrics").innerText = lyricsText;
                    document.getElementById("status").innerText = "Sync active • Lyrics Loaded";
                    return;
                }
            }

            // 3. Fallback: Search endpoint if exact match fails
            res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanArtist + " " + cleanTrack)}`);
            if (res.ok) {
                const searchData = await res.json();
                if (Array.isArray(searchData) && searchData.length > 0) {
                    const match = searchData.find(item => item.plainLyrics || item.syncedLyrics);
                    if (match) {
                        const lyricsText = match.plainLyrics || cleanSyncedLyrics(match.syncedLyrics);
                        document.getElementById("lyrics").innerText = lyricsText;
                        document.getElementById("status").innerText = "Sync active • Lyrics Loaded";
                        return;
                    }
                }
            }

            // 4. If no lyrics found anywhere
            document.getElementById("lyrics").innerText = `No lyrics found for "${cleanTrack}" in the public database.`;
            document.getElementById("status").innerText = "Sync active • Lyrics Not Found";

        } catch (err) {
            console.error("Lyrics Error:", err);
            document.getElementById("lyrics").innerText = "Failed to connect to lyrics server.";
            document.getElementById("status").innerText = "Network Error";
        }
    }

    // Check every 5 seconds
    setInterval(checkCurrentSong, 5000);
    checkCurrentSong();
</script>


</body>
</html>
